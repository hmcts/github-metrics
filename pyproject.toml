[project]
name = "metrics"
dynamic = ["version"]
description = "Collect evidence for SDLC maturity and AI enablement decisions."
readme = "README.md"
authors = [
    { name = "Graham Jones", email = "graham@agilezebra.com" },
]
requires-python = "==3.14.*"
license = "MIT"
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.10.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Only the read-only service needs a web stack, so a collection host installs neither. Kept an extra
# rather than a dependency: `metrics collect` and `metrics evidence` run with nothing listening.
service = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
metrics = "metrics.cli:main"
# Its own entry point rather than a `metrics serve` subcommand: the service loads configuration and
# serves it, sharing no argument with the collection commands, and `cli.py` is heavily edited elsewhere.
metrics-serve = "metrics.service:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics"]

[tool.uv]
managed = true
package = true

[dependency-groups]
dev = [
    "fastapi>=0.115",
    # FastAPI's TestClient is httpx-backed, so the service tests need it whether or not anything else does.
    "httpx>=0.28",
    "mypy>=2.1.0",
    "poethepoet>=0.38.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "types-pyyaml>=6.0.12.20260724",
    "types-requests>=2.33.0.20260712",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 120
target-version = "py314"  # lint against the supported version

[tool.ruff.format]
# Black style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D107",    # __init__ is documented by its class docstring
    "D203",    # one-blank-line-before-class — conflicts with D211
    "D213",    # multi-line-summary-second-line — conflicts with D212
    "COM812",  # trailing-comma-missing — handled by the formatter
    "CPY001",  # source files do not carry copyright notices
    "E501",    # line-too-long — handled by the formatter
    "LOG015",  # root-logger calls are deliberate
    "TRY400",  # logging.error without a traceback is valid for expected, readable failures
    "PLW2901", # loop variable overwritten by assignment target
    "TC001",   # first-party typing-only imports stay at module scope; no TYPE_CHECKING ceremony
    "TC002",   # third-party typing-only imports stay at module scope
    "TC003",   # standard-library typing-only imports stay at module scope
]

dummy-variable-rgx = "_+|unused|.*_unused"

[tool.ruff.lint.per-file-ignores]
"cli.py" = [
    "D415",    # the standard entry-point docstring omits terminal punctuation
]
"service.py" = [
    "D415",    # the standard entry-point docstring omits terminal punctuation
]
"scripts/*" = [
    "INP001",  # measurement scripts are run directly, not imported
]
"tests/*" = [
    "S101",    # asserts are the point of a test
    "D103",    # test functions document themselves through their names
    "PLR2004", # literal comparisons are normal in test assertions
    "PLR0913", # event-building helpers take one keyword per overridable field
    "INP001",  # the test tree is deliberately not an importable package
]

[tool.ruff.lint.isort]
known-first-party = ["metrics"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
# `mypy .` walks the working tree, so anything git ignores — a scratch script, a checkout of another
# project kept beside this one for reference — is not this project's code to type check.
exclude_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
exclude_also = ["if __name__ == .__main__.:"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format --check ."
types = "mypy ."
test = "pytest"
cover = "pytest --cov=metrics --cov-report=term-missing"
check = [
    { ref = "lint" },
    { ref = "format" },
    { ref = "types" },
    { ref = "cover" },
]
