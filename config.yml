version: 1
organization: hmcts
database: .metrics/metrics.sqlite3
lookback:
  operational_days: 90
  maximum_days: 365
  stale_open_days: 14
triviality:
  maximum_lines: 10
  maximum_files: 1
assessment:
  enabled: true
  minimum_merges: 10
  independent-review-coverage:
    green_percentage: 90
    amber_percentage: 70
  approval-coverage:
    green_percentage: 90
    amber_percentage: 70
  checks-passing-at-merge:
    green_percentage: 90
    amber_percentage: 70
  # Flow signals are graded by cost rather than compliance, so the boundary is a maximum, not a
  # minimum — and each caps at amber, because a cost is never evidence that anything ungoverned merged.
  pull-request-size:
    maximum: 400
  merge-cycle-time:
    maximum: 24
  time-to-first-review:
    maximum: 8
  # Two allowances, and a repository is within the policy when either forgives it: the percentage
  # carries the judgement because two unreviewed merges out of 246 is a pair of lapses and two out
  # of 20 is a habit, and the count is the absolute floor beneath it for a thin cohort.
  unreviewed-substantial-merges:
    maximum_count: 0
    maximum_percentage: 1
  # A caution boundary rather than a green/amber pair: a shallow review rate is weighed, never
  # allowed to hold the readiness label down.
  review-depth-minimum-percentage: 50
# Neither number enters the readiness label. `reference_patterns` is a list because HMCTS traces work
# through both a GitHub issue and a Jira key; the defaults below match those two.
traceability:
  minimum_description: 30
  reference_patterns:
    - '#\d+'
    - '[A-Z][A-Z0-9]+-\d+'
excluded_repositories: []
# Generated by scripts/build_team_configuration.py for the hmcts organisation. Every one
# of the 1863 non-archived repositories appears exactly once, across 151 teams
# (1514 archived repositories are deliberately absent, having no merges to assess). Of those,
# 1544 were attributed to a team and 319 could not be, and are under `unknown`:
#
#   teams-api-admin    949
#   codeowners-sole    200
#   teams-api-write    324
#   codeowners-first    15
#   name-prefix         56
#   unknown            319
#
# ATTRIBUTION IS BEST EFFORT AND SOME OF IT IS WRONG. `teams-api-*` rows read GitHub team ACCESS and
# `codeowners-*` rows read who is expected to REVIEW; neither is a statement of ownership, and where
# several teams claimed a repository the most specific claim was taken. `name-prefix` rows were not
# claimed by anything and were attributed by sharing a name family with repositories that were.
# Correct any of it by hand — the population is what this file guarantees, not the grouping.
# Excluded as not owning teams, so no repository is attributed to them: all-org-members.
#
# 4 of the teams below are NOT in the organisation's team list, so each is a handle a
# CODEOWNERS file names that has since been renamed, deleted or mistyped — or a team this token may
# not see. The repositories under them are grouped by what their CODEOWNERS says and are sound as a
# grouping, but the slug should not be relied on. None of them was allowed to attribute by name:
#   alphagov-gov-uk-prototype-developers
#   cp-x-cjs-data-api
#   mozilla-pdfjs-l10n
#   sonarsource-sonarqube-team
